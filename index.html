<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos CLP (Cloud)</title>
  
  <!-- SDKs de Firebase (Versión Modular 10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Pega aquí tus credenciales reales de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioActual = null;

    // Formateador de moneda para Pesos Chilenos (CLP)
    const formatearCLP = (monto) => {
      return '$' + Number(monto).toLocaleString('es-CL');
    };

    // --- AUTENTICACIÓN ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        usuarioActual = user;
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        cargarTransacciones();
      } else {
        usuarioActual = null;
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('app-container').style.display = 'none';
      }
    });

    window.registrar = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        alert('¡Cuenta creada e iniciada con éxito!');
      } catch (error) {
        alert('Error al registrarse: ' + error.message);
      }
    };

    window.iniciarSesion = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (error) {
        alert('Error al iniciar sesión: ' + error.message);
      }
    };

    window.cerrarSesion = async () => {
      await signOut(auth);
    };

    // --- GESTIÓN DE DATOS EN LA NUBE (FIRESTORE) ---
    window.agregarTransaccion = async (e) => {
      e.preventDefault();
      if (!usuarioActual) return;

      const descripcion = document.getElementById('desc').value;
      const monto = Number(document.getElementById('monto').value);
      const categoria = document.getElementById('categoria').value;
      const tipo = document.getElementById('tipo').value;

      try {
        await addDoc(collection(db, "transacciones"), {
          userId: usuarioActual.uid,
          descripcion,
          monto,
          categoria,
          tipo,
          fecha: serverTimestamp()
        });

        document.getElementById('form-transaccion').reset();
        cargarTransacciones();
      } catch (error) {
        console.error("Error al guardar:", error);
      }
    };

    async function cargarTransacciones() {
      const listaEl = document.getElementById('lista-transacciones');
      listaEl.innerHTML = '<p>Cargando datos de la nube...</p>';

      try {
        const q = query(
          collection(db, "transacciones"), 
          where("userId", "==", usuarioActual.uid)
        );
        
        const querySnapshot = await getDocs(q);
        let html = '';
        let totalIngresos = 0;
        let totalGastos = 0;

        querySnapshot.forEach((docSnap) => {
          const t = docSnap.data();
          const id = docSnap.id;
          
          if (t.tipo === 'ingreso') totalIngresos += t.monto;
          else totalGastos += t.monto;

          html += `
            <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ddd;">
              <span>${t.descripcion} (${t.categoria}) - <b>${formatearCLP(t.monto)}</b></span>
              <button onclick="eliminarTransaccion('${id}')" style="background: #ff4d4d; color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer;">X</button>
            </div>
          `;
        });

        listaEl.innerHTML = html || '<p>No hay transacciones registradas.</p>';
        
        // Actualizar resumen en pantalla
        document.getElementById('total-balance').innerText = formatearCLP(totalIngresos - totalGastos);
        document.getElementById('total-ingresos').innerText = formatearCLP(totalIngresos);
        document.getElementById('total-gastos').innerText = formatearCLP(totalGastos);

      } catch (error) {
        console.error("Error al cargar transacciones:", error);
      }
    }

    window.eliminarTransaccion = async (id) => {
      if (confirm('¿Estás seguro de eliminar este registro?')) {
        await deleteDoc(doc(db, "transacciones", id));
        cargarTransacciones();
      }
    };
  </script>

  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <!-- CONTENEDOR DE LOGIN / REGISTRO -->
  <div id="auth-container" class="card" style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h2>Control de Gastos CLP</h2>
    <p>Inicia sesión o regístrate para sincronizar tus datos en la nube.</p>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
    <button onclick="registrar()" style="background: #28a745;">Registrarse</button>
  </div>

  <!-- CONTENEDOR PRINCIPAL DE LA APP -->
  <div id="app-container" style="display: none; max-width: 600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Mis Finanzas 🇨🇱</h2>
      <button onclick="cerrarSesion()" style="width: auto; background: #dc3545; padding: 8px 15px;">Cerrar Sesión</button>
    </div>

    <!-- Tarjetas de Resumen -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <div class="card" style="flex: 1; text-align: center; margin:0;">
        <h4>Balance</h4>
        <h3 id="total-balance">$0</h3>
      </div>
      <div class="card" style="flex: 1; text-align: center; margin:0;">
        <h4>Ingresos</h4>
        <h3 id="total-ingresos" style="color: green;">$0</h3>
      </div>
      <div class="card" style="flex: 1; text-align: center; margin:0;">
        <h4>Gastos</h4>
        <h3 id="total-gastos" style="color: red;">$0</h3>
      </div>
    </div>

    <!-- Formulario para Agregar Transacción -->
    <div class="card">
      <h3>Nueva Transacción</h3>
      <form id="form-transaccion" onsubmit="agregarTransaccion(event)">
        <input type="text" id="desc" placeholder="Descripción (ej. Supermercado)" required>
        <input type="number" id="monto" placeholder="Monto en CLP (ej. 25000)" required>
        <select id="tipo">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
        <select id="categoria">
          <option value="Alimentación">Alimentación</option>
          <option value="Transporte">Transporte</option>
          <option value="Vivienda">Vivienda</option>
          <option value="Entretenimiento">Entretenimiento</option>
          <option value="Sueldo">Sueldo</option>
          <option value="Otros">Otros</option>
        </select>
        <button type="submit" style="background: #28a745; margin-top: 10px;">Guardar Transacción</button>
      </form>
    </div>

    <!-- Listado -->
    <div class="card">
      <h3>Historial</h3>
      <div id="lista-transacciones"></div>
    </div>
  </div>

</body>
</html>
